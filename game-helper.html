<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도감길드 파티퀘스트 도우미</title>
<script>
(function(){
  var t = localStorage.getItem('dogam-gildae-theme');
  if (t === 'dark') {
    document.documentElement.setAttribute('data-theme','dark');
    document.documentElement.style.colorScheme = 'dark';
  } else {
    document.documentElement.style.colorScheme = 'light';
  }
})();
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><path fill='%23c89432' stroke='%23000000' stroke-width='1.5' stroke-linejoin='round' d='M36 20.917c0-.688-2.895-.5-3.125-1s3.208-4.584 2.708-5.5-5.086 1.167-5.375.708c-.288-.458.292-3.5-.208-3.875s-5.25 4.916-5.917 4.292c-.666-.625 1.542-10.5 1.086-10.698-.456-.198-3.419 1.365-3.793 1.282C21.002 6.042 18.682 0 18 0s-3.002 6.042-3.376 6.125c-.374.083-3.337-1.48-3.793-1.282-.456.198 1.752 10.073 1.085 10.698C11.25 16.166 6.5 10.875 6 11.25s.08 3.417-.208 3.875c-.289.458-4.875-1.625-5.375-.708s2.939 5 2.708 5.5-3.125.312-3.125 1 8.438 5.235 9 5.771c.562.535-2.914 2.802-2.417 3.229.576.496 3.839-.83 10.417-.957V35c0 .553.448 1 1 1 .553 0 1-.447 1-1v-6.04c6.577.127 9.841 1.453 10.417.957.496-.428-2.979-2.694-2.417-3.229.562-.536 9-5.084 9-5.771z'/></svg>">
<style>
:root {
  color-scheme: light;
  --brown:          #16181c;
  --gold:           #101418;
  --gold-2:         #2b3138;
  --green:          #1b7a38;
  --red:            #c62828;
  --gray:           #6b7280;
  --dark:           #16181c;
  --bg-app:         #eceef1;
  --bg-panel:       #ffffff;
  --bg-panel-inner: #f2f4f7;
  --bg-input:       #e3e6ea;
  --border:         #d2d6dc;
  --shadow-card:    0 2px 10px rgba(20,24,30,.08);
  --accent-bg:      #e4e7ec;
  --accent-border:  #b4bac2;
  --drag-over-bg:   rgba(20,24,30,.07);
  --text-on-accent: #ffffff;
  --ol-bg:          #dcf0e0;
  --ol-border:      #9dcfa8;
  --teul-bg:        #e4e7ec;
  --gold-shadow:    rgba(16,20,24,.22);
  --gold-faint:     rgba(16,20,24,.30);
}
[data-theme="dark"] {
  color-scheme: dark;
  --brown:          #e7e9ec;
  --gold:           #dfe3e8;
  --gold-2:         #9aa2ab;
  --green:          #6fcf80;
  --red:            #e57373;
  --gray:           #969ba3;
  --dark:           #e7e9ec;
  --bg-app:         #131519;
  --bg-panel:       #1b1e23;
  --bg-panel-inner: #23272d;
  --bg-input:       #0f1114;
  --border:         #333941;
  --shadow-card:    0 6px 18px rgba(0,0,0,.5);
  --accent-bg:      #2c3138;
  --accent-border:  #4e555e;
  --drag-over-bg:   rgba(255,255,255,.08);
  --text-on-accent: #131519;
  --ol-bg:          #1e3324;
  --ol-border:      #37613f;
  --teul-bg:        #2c3138;
  --gold-shadow:    rgba(0,0,0,.45);
  --gold-faint:     rgba(223,227,232,.30);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

/* 탭마다 페이지 높이가 달라 스크롤바가 생겼다 사라졌다 하면서
   가운데 정렬된 내용(제목 포함)이 좌우로 살짝 밀리는 것을 방지 */
html { scrollbar-gutter: stable; }

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-input); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--gold); }

* { scrollbar-color: var(--border) var(--bg-input); scrollbar-width: thin; }

body {
  font-family: 'Segoe UI', 'Noto Sans KR', sans-serif;
  background: var(--bg-app);
  color: var(--dark);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 24px 16px;
  transition: background 0.2s;
}
/* 아모리안 파티퀘스트 탭이 활성화되면 뒷배경 전체(뷰포트 폭)에 그라데이션 적용 */
body.amo-active {
  background: linear-gradient(135deg, #d199be, #99a2d1);
}

.container { width: 100%; max-width: 560px; }

h1 {
  text-align: center;
  color: var(--brown);
  font-size: 1.4rem;
  margin-bottom: 4px;
}

.subtitle {
  text-align: center;
  color: var(--gray);
  font-size: 0.8rem;
  margin-bottom: 20px;
}

/* ── Stats Bar ── */
.stats {
  display: flex;
  justify-content: space-around;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 14px;
}
.stat { text-align: center; }
.stat-val { font-size: 1.5rem; font-weight: 700; color: var(--gold); }
.stat-lbl { font-size: 0.72rem; color: var(--gray); margin-top: 1px; }

/* ── Element Badges ── */
.el { display:inline-flex; align-items:center; justify-content:center;
      width:34px; height:34px; border-radius:8px; font-weight:700; font-size:0.95rem; }
.el-0 { background:#3b5c2f; color:#c8e6c0; }
.el-1 { background:#22c55e; color:#fff; }
.el-2 { background:#eab308; color:#1a1a1a; }
.el-3 { background:#f0f4f0; color:#1a1a1a; border:1px solid #1a1a1a; }

/* ── History ── */
.card {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 12px;
}
.card-title {
  font-size: 0.72rem;
  color: var(--gray);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 10px;
}
.history-empty { text-align:center; color:var(--border); font-size:0.85rem; padding:10px 0; }

.h-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}
.h-num { width:18px; font-size:0.72rem; color:var(--gray); flex-shrink:0; }
.h-poss { font-size:0.72rem; color:var(--border); margin-left:auto; flex-shrink:0; }
.h-els { display:flex; gap:4px; }
.h-fbs { display:flex; gap:4px; margin-left:8px; }

.fb { padding:2px 9px; border-radius:20px; font-size:0.78rem; font-weight:700; }
.fb-ol   { background:var(--ol-bg); color:var(--green); border:1px solid var(--ol-border); }
.fb-teul { background:var(--accent-bg); color:var(--gold);  border:1px solid var(--accent-border); }
.fb-mol  { background:var(--bg-panel-inner); color:var(--gray);  border:1px solid var(--border); }

.game-msg { text-align:center; font-size:1rem; font-weight:700; padding-top:8px; }
.game-win  { color:var(--green); }
.game-lose { color:var(--red); }

/* ── Suggestion ── */
.suggest-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }

/* ── Picker Grid ── */
.picker-grid {
  display: grid;
  grid-template-columns: 22px repeat(4, 1fr);
  gap: 4px;
  margin-bottom: 14px;
}
.pg-corner { }
.pg-header {
  text-align: center;
  font-size: 0.72rem;
  color: var(--gray);
  padding-bottom: 2px;
}
.pg-label {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 4px;
}
.pg-btn {
  height: 38px;
  border: 2px solid var(--border);
  border-radius: 7px;
  cursor: pointer;
  font-weight: 700;
  font-size: 0.9rem;
  background: var(--bg-input);
  color: var(--gray);
  transition: all 0.1s;
}
.pg-btn:hover { border-color: var(--gray); color: var(--brown); }
.pg-btn.sel-0 { background:#3b5c2f; color:#c8e6c0; border-color:#3b5c2f; }
.pg-btn.sel-1 { background:#22c55e; color:#fff; border-color:#22c55e; }
.pg-btn.sel-2 { background:#eab308; color:#1a1a1a; border-color:#eab308; }
.pg-btn.sel-3 { background:#f0f4f0; color:#1a1a1a; border-color:#1a1a1a; }

/* ── Feedback Input ── */
.fb-input-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 14px;
}
.fb-grp { display:flex; align-items:center; gap:8px; }
.fb-grp label { font-size:0.85rem; font-weight:700; width:24px; flex-shrink:0; }
.lbl-ol   { color:var(--green); }
.lbl-teul { color:var(--gold); }
.lbl-mol  { color:var(--gray); }
.num-row { display:flex; gap:5px; }
.num-btn {
  width:36px; height:36px;
  border:2px solid var(--border); border-radius:7px;
  background:var(--bg-input); color:var(--gray);
  cursor:pointer; font-size:0.95rem; font-weight:700;
  transition: all 0.1s;
}
.num-btn:hover { border-color:var(--gray); color:var(--brown); }
.num-btn.active-ol   { background:var(--ol-bg); border-color:var(--green); color:var(--green); }
.num-btn.active-teul { background:var(--teul-bg); border-color:var(--gold);  color:var(--gold); }
.mol-display { font-size:1rem; font-weight:700; color:var(--gray); width:36px; text-align:center; }
.mol-eq  { font-size:0.75rem; color:var(--gray); }

.submit-btn {
  width:100%; padding:11px;
  background: linear-gradient(135deg, var(--gold), var(--gold-2));
  color: var(--text-on-accent);
  border:none; border-radius:9px;
  font-size:1rem; font-weight:700;
  cursor:pointer; transition:opacity 0.15s;
  margin-bottom:8px;
  box-shadow: 0 2px 8px var(--gold-shadow);
}
.submit-btn:hover { opacity: 0.88; }
.submit-btn:disabled { background:var(--bg-panel); color:var(--border); box-shadow:none; cursor:not-allowed; }

/* ── 불가능한 조합 경고 ── */
.submit-wrap { position:relative; }
@keyframes fb-shake {
  0%,100% { transform:translateX(0); }
  15% { transform:translateX(-7px); }
  30% { transform:translateX(6px); }
  45% { transform:translateX(-5px); }
  60% { transform:translateX(4px); }
  80% { transform:translateX(-2px); }
}
.submit-btn.invalid {
  background: var(--red);
  box-shadow: 0 2px 8px rgba(198,40,40,.45);
  animation: fb-shake 0.45s;
}
.warn-bubble {
  position:absolute; left:0; right:0; bottom:calc(100% + 1px);
  background: var(--red); color:#fff;
  padding:8px 10px; border-radius:9px;
  font-size:0.78rem; line-height:1.45; text-align:center;
  box-shadow: 0 3px 10px rgba(0,0,0,.28);
  z-index:5; opacity:1; transition:opacity 0.3s;
  cursor: pointer;
}
.warn-bubble.hide { opacity:0; }
.warn-bubble::after {
  content:''; position:absolute; top:100%; left:50%; margin-left:-6px;
  border:6px solid transparent; border-top-color: var(--red);
}

.btn-row { display:flex; gap:8px; }
.undo-btn {
  flex:1; padding:8px;
  background:transparent; color:var(--gold);
  border:1px solid var(--accent-border); border-radius:9px;
  font-size:0.85rem; cursor:pointer;
  transition:all 0.15s;
}
.undo-btn:hover { color:var(--brown); border-color:var(--gold); }
.undo-btn:disabled { color:var(--border); border-color:var(--bg-panel); cursor:not-allowed; }
.reset-btn {
  flex:1; padding:8px;
  background:transparent; color:var(--gray);
  border:1px solid var(--border); border-radius:9px;
  font-size:0.85rem; cursor:pointer;
  transition:all 0.15s;
}
.reset-btn:hover { color:var(--brown); border-color:var(--gray); }

.no-sol { color:var(--red); font-size:0.85rem; }

.suggest-info { font-size:0.78rem; color:var(--gray); }
.code-line {
  font-family: 'Consolas', 'D2Coding', monospace;
  letter-spacing: 0.08em; color: var(--gray);
}
.needs-row { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
.need-cell {
  display:flex; flex-direction:column; align-items:center; gap:5px;
  padding:9px 4px; border-radius:8px;
  background:var(--bg-panel-inner); border:1px solid var(--border);
  transition:all 0.15s;
}
.need-cell.need-fixed { background:var(--accent-bg); border-color:var(--accent-border); }
.need-cell.need-none  { opacity:0.4; }
.need-max { font-size:1.2rem; font-weight:800; color:var(--dark); line-height:1; }
.need-max em { font-size:0.68rem; font-weight:600; font-style:normal; margin-left:1px; }
.need-sub { font-size:0.62rem; color:var(--gray); min-height:0.95em; }
.needs-row .no-sol { grid-column:1 / -1; }
/* ── Tabs ── */
.tab-bar {
  display: flex;
  gap: 4px;
  max-width: 560px;
  margin-left: auto;
  margin-right: auto;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 16px;
}
.tab-btn {
  flex: 1;
  padding: 8px 12px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--gray);
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.tab-btn:hover { color: var(--brown); background: var(--bg-panel-inner); }
.tab-btn.active { background: var(--bg-input); color: var(--gold); }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* ── Reward Distributor ── */
.container-wide { max-width: 900px; }
.reward-wrap { display: flex; flex-direction: column; gap: 12px; }

.reward-top-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 6px;
}
.reward-count-label { font-size: 0.8rem; color: var(--gray); }
.reward-count-select {
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 6px; color: var(--dark);
  font-size: 0.85rem; padding: 4px 8px;
  cursor: pointer; outline: none; font-family: inherit;
}
.reward-count-select:focus { border-color: var(--gold); }
.reward-img-btn {
  padding: 4px 10px;
  background: transparent; color: var(--gray);
  border: 1px solid var(--border); border-radius: 6px;
  font-size: 0.78rem; cursor: pointer; transition: all 0.15s;
}
.reward-img-btn:hover { border-color: var(--gray); color: var(--brown); }

.reward-map-container {
  position: relative; width: 100%; aspect-ratio: 850/182;
  background: var(--bg-input);
  border-radius: 8px; overflow: hidden;
  background-size: 100% 100%; background-repeat: no-repeat;
}
/* 지도 구역: 상자 좌표에서 만든 모양 (SVG, 지도와 같은 850×182 좌표계) */
.rmap-svg { position:absolute; inset:0; width:100%; height:100%; }
.rmap-zone { --z-edge:#e0b060; --z-fill:#3a2c10; opacity:0.5; transition:opacity 0.15s; }
.rmap-zone.has-name { opacity:0.68; }
.rmap-zone.big { --z-edge:#f1f3f6; --z-fill:#848b95; }
.rmap-zone.drag-over { opacity:0.88; --z-fill:#6e5a24; }
.rmap-zone.big.drag-over { --z-fill:#a9b0b9; }
.rmap-zone line { stroke-linecap:round; }
.rmap-edge line { stroke:var(--z-edge); }
.rmap-edge circle { fill:var(--z-edge); }
.rmap-fill line { stroke:var(--z-fill); }
.rmap-fill circle { fill:var(--z-fill); }
.rmap-legend { display:flex; align-items:center; gap:6px; margin-top:6px; font-size:0.68rem; color:var(--gray); }
.rmap-legend-swatch {
  width:12px; height:12px; border-radius:6px; flex-shrink:0;
  background:#848b95; border:1.5px solid #c9ced5; opacity:0.9;
}
/* 구역 이름표: "5 · 길마" — 배정된 사람은 끌어서 옮길 수 있음 */
.rmap-tag {
  position:absolute; z-index:1; transform:translate(-50%, -50%);
  padding:1px 7px; border-radius:10px; white-space:nowrap; user-select:none;
  font-size:0.66rem; font-weight:700; line-height:1.35; color:#fff;
  background:rgba(0,0,0,0.8); border:1px solid #e0b060;
  max-width:9em; overflow:hidden; text-overflow:ellipsis;
}
.rmap-tag.big { border-color:#e3e7ec; }
.rmap-tag:not(.has-name) { color:rgba(255,255,255,0.72); font-weight:600; border-style:dashed; }
.rmap-tag.has-name { cursor:grab; }
.rmap-tag.dragging { opacity:0.35; }

.reward-bottom-row {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; align-items: start;
}

.reward-add-row { display: flex; gap: 6px; margin-bottom: 8px; }
.reward-name-input {
  flex: 1; min-width: 0;
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 6px; color: var(--dark);
  font-size: 0.85rem; padding: 5px 8px;
  outline: none; font-family: inherit;
}
.reward-name-input:focus { border-color: var(--gold); }
.reward-add-btn {
  padding: 5px 10px;
  background: linear-gradient(135deg, var(--gold), var(--gold-2));
  color: var(--text-on-accent); border: none; border-radius: 6px;
  font-size: 0.82rem; font-weight: 700;
  cursor: pointer; white-space: nowrap; transition: opacity 0.15s;
}
.reward-add-btn:hover { opacity: 0.85; }

.name-pool {
  display: flex; flex-wrap: wrap; gap: 6px;
  min-height: 44px; padding: 6px;
  border: 1px dashed var(--border); border-radius: 8px;
  transition: all 0.15s;
}
.name-pool.drag-over { border-color: var(--gold); background: var(--drag-over-bg); }

/* 오늘 빼기 드롭 칩 (삭제 아님 — 전체 목록에는 남음) */
#reward-out-drop {
  display:inline-flex; align-items:center; margin-left:8px; vertical-align:middle;
  padding:1px 8px; border-radius:10px; border:1px dashed var(--border);
  font-size:0.62rem; font-weight:600; color:var(--gray); cursor:default;
  transition: all 0.15s;
}
#reward-out-drop.drop-hover { border-style:solid; border-color:var(--red); color:var(--red); background:var(--drag-over-bg); }
@keyframes out-drop-pulse { 0%,100% { transform:scale(1); } 40% { transform:scale(1.14); } }
#reward-out-drop.dropped { animation: out-drop-pulse 0.35s ease-out; }
/* 전체 목록도 오늘 빼기 드롭 영역 */
#reward-all-members { border-radius: 6px; outline: 2px dashed transparent; outline-offset: 1px; transition: outline-color 0.15s, background 0.15s; }
#reward-all-members.drop-hover { outline-color: var(--red); background: var(--drag-over-bg); }
#reward-all-members.drop-hover::before {
  content: '여기에 놓으면 오늘 빼기';
  position: sticky; top: 0; z-index: 1;
  padding: 3px 0; text-align: center;
  font-size: 0.68rem; font-weight: 700; color: #fff;
  background: var(--red); border-radius: 4px;
}

/* 인원수 자동/수동 표시 */
.reward-mode { display:inline-flex; align-items:center; gap:5px; font-size:0.68rem; color:var(--gray); }
.reward-mode.manual { color:var(--dark); font-weight:600; }
.reward-mode button {
  font-size:0.62rem; padding:1px 6px; border-radius:6px; cursor:pointer;
  background:var(--bg-input); color:var(--gray); border:1px solid var(--border);
}
.reward-mode button:hover { color:var(--dark); border-color:var(--gray); }

/* 자리 배정: 판 진행 */
.reward-round-title { display:flex; align-items:center; justify-content:space-between; }
.reward-round {
  font-size:0.72rem; font-weight:700; color:var(--gold);
  padding:1px 8px; border-radius:10px;
  background:var(--accent-bg); border:1px solid var(--accent-border);
}
#reward-notice { display:flex; flex-direction:column; gap:4px; margin-bottom:6px; }
#reward-notice:empty { display:none; }
.reward-notice-item {
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  font-size:0.7rem; color:var(--red);
  padding:4px 8px; border-radius:6px;
  background:var(--bg-panel-inner); border:1px solid var(--border);
}
.reward-notice-item.info { color:var(--gray); }
.reward-notice-item button {
  font-size:0.65rem; padding:1px 7px; border-radius:6px; cursor:pointer;
  background:var(--bg-input); color:var(--dark); border:1px solid var(--border);
}
.reward-next-btn {
  width:100%; margin-top:6px; padding:9px;
  background: linear-gradient(135deg, var(--gold), var(--gold-2));
  color:var(--text-on-accent); border:none; border-radius:8px;
  font-size:0.88rem; font-weight:700; cursor:pointer; transition:opacity 0.15s;
}
.reward-next-btn:hover { opacity:0.88; }
.reward-sub-actions { display:flex; gap:6px; margin-top:6px; }
.reward-sub-actions button {
  flex:1; padding:5px; font-size:0.72rem; cursor:pointer;
  background:transparent; color:var(--gray);
  border:1px solid var(--border); border-radius:6px; transition:all 0.15s;
}
.reward-sub-actions button:hover:not(:disabled) { color:var(--dark); border-color:var(--gray); }
.reward-sub-actions button:disabled { opacity:0.45; cursor:not-allowed; }
.reward-reset-link {
  display:block; margin:10px auto 0; background:none; border:none;
  font-size:0.62rem; color:var(--gray); opacity:0.7; cursor:pointer; text-decoration:underline;
}
.reward-reset-link:hover { color:var(--red); opacity:1; }

#reward-toast {
  position:fixed; left:50%; bottom:28px; transform:translate(-50%, 12px);
  padding:8px 16px; border-radius:20px;
  background:var(--dark); color:var(--bg-panel);
  font-size:0.82rem; font-weight:600; text-align:center;
  max-width:calc(100vw - 32px);
  opacity:0; pointer-events:none; transition:opacity 0.2s, transform 0.2s;
  z-index:9600;
}
#reward-toast.show { opacity:1; transform:translate(-50%, 0); }

.name-card {
  padding: 4px 10px;
  background: var(--bg-panel-inner); border: 1px solid var(--border);
  border-radius: 6px; font-size: 0.82rem; color: var(--dark);
  cursor: grab; user-select: none; transition: all 0.1s;
  display: flex; flex-direction: column; gap: 1px;
}
.name-card:hover { border-color: var(--gold); color: var(--gold); }
.name-card.dragging { opacity: 0.35; }
/* 오늘 참가 풀: 자리에 들어간 사람은 흐리게, 안 들어간 사람은 대기 태그 */
.name-card.assigned { background: var(--bg-input); border-style: dashed; color: var(--gray); }
.name-card.assigned:hover { color: var(--gold); }
.name-slot-tag {
  margin-left: auto; flex-shrink: 0;
  font-size: 0.58rem; font-weight: 700; padding: 1px 6px; border-radius: 10px;
}
.name-slot-tag.wait { background: transparent; color: var(--red); border: 1px solid var(--red); }
.name-stat-line { font-size: 0.62rem; color: var(--gray); line-height: 1.2; }

.zone-slot {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 8px; border-radius: 7px;
  border: 1px solid var(--border); background: var(--bg-input);
  margin-bottom: 5px; min-height: 36px; transition: all 0.15s;
}
.zone-slot.drag-over { border-color: var(--gold); background: var(--drag-over-bg); }
.zone-slot-num { font-size: 0.72rem; color: var(--gray); width: 16px; flex-shrink: 0; font-weight: 700; }
.zone-slot-names { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }


.version-label {
  position: fixed;
  bottom: 10px; right: 12px;
  font-size: .6rem;
  color: var(--gold-faint);
  cursor: default;
  user-select: none;
  letter-spacing: .03em;
}

.auto-sim-btn {
  padding: 5px 12px;
  background: var(--accent-bg); color: var(--gold);
  border: 1px solid var(--accent-border); border-radius: 7px;
  font-size: 0.8rem; font-weight: 700;
  cursor: pointer; transition: all 0.15s;
  margin-top: 8px;
}
.auto-sim-btn:hover { background: var(--gold); color: var(--text-on-accent); }
.auto-sim-btn:disabled { background: var(--bg-panel); color: var(--border); border-color:var(--bg-panel); cursor:not-allowed; }

/* ── Test Mode ── */
.test-card {
  background: var(--bg-panel);
  border: 1px solid var(--accent-border);
  border-radius: 12px;
  padding: 12px 16px;
  margin-bottom: 12px;
}
.test-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
}
.test-title {
  font-size: 0.72rem;
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.test-toggle {
  font-size: 0.75rem;
  color: var(--gold);
  background: transparent;
  border: 1px solid var(--accent-border);
  border-radius: 6px;
  padding: 2px 8px;
  cursor: pointer;
  transition: all 0.15s;
}
.test-toggle:hover { border-color: var(--gold); color: var(--brown); }
.test-body { margin-top: 10px; }
.test-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.test-label { font-size: 0.8rem; color: var(--gold); }
.test-set-btn {
  padding: 5px 14px;
  background: linear-gradient(135deg, var(--gold), var(--gold-2));
  color: var(--text-on-accent);
  border: none;
  border-radius: 7px;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.15s;
}
.test-set-btn:hover { opacity: 0.85; }
.test-active-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.78rem;
  color: var(--gold);
  margin-top: 6px;
}
/* Picker reused inside test with a different class */
.test-picker { display: flex; gap: 6px; }
.tp-grp { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.tp-lbl { font-size: 0.68rem; color: var(--gray); }
.tp-sel {
  width: 44px; height: 36px;
  border: 2px solid var(--border); border-radius: 7px;
  background: var(--bg-input); color: var(--gray);
  font-weight: 700; font-size: 0.9rem;
  cursor: pointer; transition: all 0.1s;
}
.tp-sel:hover { border-color: var(--gray); }
.tp-active-0 { background:#3b5c2f; color:#c8e6c0; border-color:#3b5c2f; }
.tp-active-1 { background:#22c55e; color:#fff; border-color:#22c55e; }
.tp-active-2 { background:#eab308; color:#1a1a1a; border-color:#eab308; }
.tp-active-3 { background:#f0f4f0; color:#1a1a1a; border-color:#1a1a1a; }

/* ── 아모리안 파티퀘스트: 독립 테마 (다른 탭의 라이트/다크 토글과 무관, 추후 재디자인 예정) ── */
#tab-amo {
  --brown:          #3b3260;
  --gold:           #6472b9;
  --gold-2:         #b964ab;
  --green:          #2b9cd8;
  --red:            #e74c3c;
  --gray:           #8d84a6;
  --dark:           #3b3260;
  --bg-panel:       rgba(255,255,255,.8);
  --bg-panel-inner: rgba(255,255,255,.55);
  --bg-input:       rgba(255,255,255,.55);
  --border:         #a89bc4;
  --shadow-card:    0 4px 18px rgba(100,70,150,.18);
  --accent-bg:      rgba(255,255,255,.65);
  --accent-border:  #8f7cc7;
  --drag-over-bg:   rgba(100,114,185,.1);
  --text-on-accent: #ffffff;
  --ol-bg:          rgba(255,255,255,.65);
  --ol-border:      #8f7cc7;
  --teul-bg:        rgba(255,255,255,.65);
  --gold-shadow:    rgba(100,114,185,.3);
  --gold-faint:     rgba(185,100,171,.35);
  color: var(--dark);
}
#tab-amo .card { backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.amo-tile-row { display:flex; gap:8px; justify-content:center; margin-bottom:8px; }
.amo-tile {
  width: 52px; height: 52px;
  border: 2px solid var(--border); border-radius: 9px;
  background: var(--bg-input); color: var(--gray);
  font-weight: 700; font-size: 1rem;
  cursor: pointer; transition: all 0.1s;
}
.amo-tile:hover { border-color: var(--gray); color: var(--brown); }
.amo-tile.sel {
  background: linear-gradient(135deg, var(--gold), var(--gold-2));
  color: var(--text-on-accent); border-color: var(--gold);
}
/* ── 아모리안 히스토리: 시도마다 9칸 미니 보드로 표시 ── */
.amo-h-row {
  display: flex; align-items: center; gap: 10px;
  padding-bottom: 10px; margin-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.amo-h-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.amo-h-num { width: 16px; font-size: 0.72rem; color: var(--gray); flex-shrink: 0; }
.amo-mini-board { display: flex; flex-direction: column; gap: 3px; }
.amo-tile-mini-row { display: flex; gap: 3px; justify-content: center; }
.amo-tile-mini {
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--border); border-radius: 6px;
  background: var(--bg-input); color: var(--gray);
  font-weight: 700; font-size: 0.68rem;
}
.amo-tile-mini.sel {
  background: linear-gradient(135deg, var(--gold), var(--gold-2));
  color: var(--text-on-accent); border-color: var(--gold);
}
.amo-h-meta {
  margin-left: auto; flex-shrink: 0;
  display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
}
</style>
</head>
<body>
<div class="container">
  <h1>도감길드 퍼즐 도우미</h1>
  <p class="subtitle" style="margin-bottom:4px;">도감길드 파이팅!</p>
  <p class="subtitle" style="margin-bottom:4px;">오류나 개선사항 있으면 피드백 주세요</p>
  <p class="subtitle code-line">2-1-5-2-2-1-2</p>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('gildae')">길드 대항전 퍼즐</button>
    <button class="tab-btn" onclick="switchTab('reward')">보상방 분배기</button>
    <button class="tab-btn" onclick="switchTab('amo')">아모리안 파티퀘스트</button>
  </div>

  <div class="tab-content active" id="tab-gildae">
  <div class="stats">
    <div class="stat">
      <div class="stat-val" id="stat-left">7</div>
      <div class="stat-lbl">남은 시도</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="stat-poss">256</div>
      <div class="stat-lbl">가능한 경우의 수</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="stat-used">0</div>
      <div class="stat-lbl">사용한 시도</div>
    </div>
  </div>

  <!-- History -->
  <div class="card" id="history-card">
    <div class="card-title">입력 기록</div>
    <div class="history-empty" id="hist-empty">아직 입력된 시도가 없습니다</div>
  </div>

  <!-- 게임 종료 시 남은 후보 -->
  <div class="card" id="endgame-card" style="display:none">
    <div class="card-title">남은 가능한 답</div>
    <div class="suggest-row" id="suggest-row"></div>
  </div>

  <!-- 아이템 그만캐! -->
  <div class="card">
    <div class="card-title">이제 그만 캐셔도 되요</div>
    <div class="needs-row" id="needs-row"></div>
  </div>

  <!-- Input -->
  <div class="card" id="input-card">
    <div class="card-title">내 추측 입력</div>

    <div class="picker-grid" id="picker-grid"></div>

    <div class="fb-input-row">
      <div class="fb-grp">
        <label class="lbl-ol">올</label>
        <div class="num-row" id="ol-row"></div>
      </div>
      <div class="fb-grp">
        <label class="lbl-teul">틀</label>
        <div class="num-row" id="teul-row"></div>
      </div>
      <div class="fb-grp">
        <label class="lbl-mol">몰</label>
        <span class="mol-display" id="v-mol">4</span>
        <span class="mol-eq">= 4 − 올 − 틀</span>
      </div>
    </div>

    <div class="submit-wrap">
      <div class="warn-bubble" id="fb-warn" style="display:none" onclick="dismissFbWarn()"></div>
      <button class="submit-btn" id="submit-btn" onclick="submitGuess()">입력</button>
    </div>
    <div class="btn-row">
      <button class="undo-btn" id="undo-btn" onclick="undoLast()" disabled>마지막 취소</button>
      <button class="reset-btn" onclick="resetGame()">처음부터 다시</button>
    </div>
  </div>

  <!-- Test Mode -->
  <div class="test-card">
    <div class="test-header" onclick="toggleTestPanel()">
      <span class="test-title">🧪 테스트 모드</span>
      <button class="test-toggle" id="test-toggle-btn">열기</button>
    </div>
    <div class="test-body" id="test-body" style="display:none">
      <div class="test-row">
        <span class="test-label">정답 설정:</span>
        <div class="test-picker" id="test-picker"></div>
        <button class="test-set-btn" onclick="activateTestMode()">적용</button>
      </div>
      <div id="test-active-info"></div>
      <button class="auto-sim-btn" id="auto-sim-btn" onclick="autoSimulate()" disabled>▶ 자동 시뮬레이션</button>
    </div>
  </div>
  </div><!-- /tab-gildae -->

  <div class="tab-content" id="tab-reward">
    <div class="reward-wrap">

      <!-- 상단: 구역 지도 -->
      <div class="card">
        <div class="card-title" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
          <span>보상방 구역 지도</span>
          <div class="reward-top-bar" style="margin-bottom:0">
            <span class="reward-count-label">인원수</span>
            <select class="reward-count-select" id="reward-count-select" onchange="rewardSetCountManual(+this.value)">
              <option value="6" selected>6명</option>
              <option value="7">7명</option>
              <option value="8">8명</option>
              <option value="9">9명</option>
            </select>
            <span class="reward-mode" id="reward-count-mode"></span>
            <button class="reward-img-btn" onclick="document.getElementById('reward-img-file').click()">🖼 이미지 선택</button>
            <input type="file" id="reward-img-file" accept="image/*" style="display:none" onchange="rewardLoadImage(this)">
          </div>
        </div>
        <div class="reward-map-container" id="reward-map-container"></div>
        <div class="rmap-legend"><span class="rmap-legend-swatch"></span>5칸 이상 먹는 자리</div>
      </div>

      <!-- 하단: 참가자 | 자리 배정 -->
      <div class="reward-bottom-row">

        <!-- 좌: 이름 풀 -->
        <div class="card">
          <div class="card-title">참가자
            <span id="reward-out-drop" title="참가자 카드를 여기에 놓으면 오늘 미참 처리 (전체 목록에는 남아요)">↩ 오늘 빼기</span>
          </div>
          <div class="reward-add-row">
            <input class="reward-name-input" id="reward-name-input" placeholder="이름 추가 (전체 목록)"
              onkeydown="if(event.key==='Enter')rewardAddName()">
            <button class="reward-add-btn" onclick="rewardAddName()">추가</button>
          </div>
          <div style="font-size:0.7rem;color:var(--gray);margin:6px 0 2px;padding-left:2px;display:flex;align-items:center;gap:4px">
            <span>전체 목록</span>
            <button onclick="rewardSortMembers()" style="font-size:0.6rem;padding:1px 6px;border-radius:6px;cursor:pointer;background:var(--bg-input);color:var(--gray);border:1px solid var(--border)">가나다↑</button>
            <button onclick="rewardToggleAll()" id="reward-toggle-all-btn" style="font-size:0.6rem;padding:1px 6px;border-radius:6px;cursor:pointer;background:var(--bg-input);color:var(--gray);border:1px solid var(--border)">전체참가</button>
          </div>
          <div id="reward-all-members" style="display:flex;flex-direction:column;gap:2px;max-height:160px;overflow-y:auto;margin-bottom:8px"></div>
          <div style="font-size:0.7rem;color:var(--gray);margin:4px 0 2px;padding-left:2px;display:flex;align-items:center;gap:5px">오늘 참가 <span id="reward-today-count" style="color:var(--gold);font-weight:700"></span></div>
          <div class="name-pool" id="reward-name-pool"
            ondragover="event.preventDefault();this.classList.add('drag-over')"
            ondragleave="this.classList.remove('drag-over')"
            ondrop="rewardDropToPool(event)">
          </div>
        </div>

        <!-- 우: 구역 슬롯 -->
        <div class="card">
          <div class="card-title reward-round-title">
            <span>자리 배정</span>
            <span class="reward-round" id="reward-round-label">1판째</span>
          </div>
          <div id="reward-notice"></div>
          <div id="reward-slots"></div>
          <button class="reward-next-btn" onclick="rewardNextRound()">판 끝! 다음 판 →</button>
          <div class="reward-sub-actions">
            <button onclick="rewardShuffle()" title="지금 판 배치만 새로 뽑아요 (기록에는 영향 없음)">다시 섞기</button>
            <button id="reward-undo-btn" onclick="rewardUndoRound()" title="마지막으로 넘긴 판의 기록을 빼고 그 배치로 돌아가요">이전 판 되돌리기</button>
          </div>
          <button class="reward-reset-link" onclick="rewardResetHistory()">전체 기록 초기화</button>
        </div>


      </div>
    </div>
  </div><!-- /tab-reward -->

  <div class="tab-content" id="tab-amo">
    <!-- History -->
    <div class="card" id="amo-history-card">
      <div class="card-title">입력 기록</div>
      <div class="history-empty" id="amo-hist-empty">아직 입력된 시도가 없습니다</div>
    </div>

    <!-- Input -->
    <div class="card" id="amo-input-card">
      <div class="card-title">발판 선택 (5명이 올라갈 곳)</div>
      <div id="amo-board"></div>
      <div style="font-size:0.78rem;color:var(--gray);margin:2px 0 14px;text-align:center">
        선택 <span id="amo-sel-count" style="color:var(--gold);font-weight:700">5</span>/5
      </div>

      <div class="fb-input-row">
        <div class="fb-grp">
          <label class="lbl-ol">정답</label>
          <div class="num-row" id="amo-correct-row"></div>
        </div>
      </div>

      <div class="submit-wrap">
        <div class="warn-bubble" id="amo-fb-warn" style="display:none" onclick="dismissAmoFbWarn()"></div>
        <button class="submit-btn" id="amo-submit-btn" onclick="submitAmoGuess()">입력</button>
      </div>
      <div class="btn-row">
        <button class="undo-btn" id="amo-undo-btn" onclick="undoAmoLast()" disabled>뒤로가기</button>
        <button class="reset-btn" onclick="resetAmoGame()">초기화</button>
      </div>
    </div>
  </div><!-- /tab-amo -->

</div>

<div id="reward-toast"></div>
<div class="version-label">똘레로_1.014.0</div>

<script>
const PATCH_NOTES = [

  },
  { ver: '1.013.0', date: '26.09.14',
    feat: [
      '보상방 지도: 사각형 대신 실제 상자 위치대로 구역 표시',
      '보상방 지도: 같은 구역 상자를 부드러운 띠로 연결, 이름표는 번호를 안 가리는 자리에 자동 배치',

const EL = ['음', '술', '훈', '두'];
const EC = ['sel-0','sel-1','sel-2','sel-3']; // selected class names

// 첫 추측은 훈 훈 두 두 고정
const FIRST_GUESS = [2,2,3,3];

// Generate all 4^4 = 256 codes
const ALL = [];
for (let a=0;a<4;a++) for (let b=0;b<4;b++) for (let c=0;c<4;c++) for (let d=0;d<4;d++)
  ALL.push([a,b,c,d]);

// State
let poss = ALL.slice();
let history = [];
let sel = [0,0,0,0]; // current selected elements per position
let ol = 0, teul = 0;
let used = 0;
let over = false;

// Current recommendation
let lastRecommendation = null;

// Test mode
let testSecret = null;   // null = off, array = secret answer
let testSel = [0,0,0,0]; // selection in test picker

// ── Mastermind feedback calculation ──
function feedback(guess, secret) {
  let blacks = 0;
  for (let i=0;i<4;i++) if (guess[i]===secret[i]) blacks++;
  let total = 0;
  for (let e=0;e<4;e++) {
    total += Math.min(guess.filter(x=>x===e).length, secret.filter(x=>x===e).length);
  }
  return { ol: blacks, teul: total - blacks };
}

function filterPoss(possibilities, guess, expOl, expTeul) {
  return possibilities.filter(s => {
    const f = feedback(guess, s);
    return f.ol === expOl && f.teul === expTeul;
  });
}

// Minimax: find guess that minimises worst-case remaining possibilities
function bestGuess(possibilities) {
  if (possibilities.length === 0) return null;
  if (possibilities.length === 1) return possibilities[0];

  const possSet = new Set(possibilities.map(p=>p.join()));
  let best = possibilities[0];
  let bestScore = Infinity;

  for (const g of ALL) {
    const parts = {};
    for (const s of possibilities) {
      const f = feedback(g, s);
      const k = f.ol*10 + f.teul;
      parts[k] = (parts[k]||0) + 1;
    }
    const worst = Math.max(...Object.values(parts));
    // Prefer guesses that are themselves still possible (tiebreak)
    const score = worst * 2 - (possSet.has(g.join()) ? 1 : 0);
    if (score < bestScore) { bestScore = score; best = g; }
  }
  return best;
}

function toggleTestPanel() {
  const body = document.getElementById('test-body');
  const btn = document.getElementById('test-toggle-btn');

function buildTestPicker() {
  const picker = document.getElementById('test-picker');
  picker.innerHTML = '';

function cycleTestSel(pos, btn) {
  testSel[pos] = (testSel[pos] + 1) % 4;
  btn.className = 'tp-sel tp-active-'+testSel[pos];
  btn.textContent = EL[testSel[pos]];
}

function activateTestMode() {
  testSecret = testSel.slice();

    s.textContent = EL[e];
    wrap.appendChild(s);
  });
  info.innerHTML = '';
  info.appendChild(wrap);
  resetGame();
  document.getElementById('auto-sim-btn').disabled = false;
}

async function autoSimulate() {
  if (!testSecret || over) return;
  const btn = document.getElementById('auto-sim-btn');
  btn.disabled = true;
  btn.textContent = '실행 중...';

  // Step through until solved or 7 attempts
  while (!over) {
    // 추천은 renderSuggestion이 이미 입력칸에 넣어둠
    if (!lastRecommendation) break;

    // Calculate feedback from secret
    const f = feedback(sel, testSecret);
    ol = f.ol; teul = f.teul;
    updateFbDisplay();

    // Submit
    const isWin = (ol === 4);
    const mol = 4 - ol - teul;
    history.push({ guess: sel.slice(), ol, teul, mol, possCount: poss.length });
    used++;
    if (!isWin) poss = filterPoss(poss, sel, ol, teul);
    if (isWin || used >= 7) over = true;

    ol = 0; teul = 0;
    updateFbDisplay();
    if (over) {
      document.getElementById('submit-btn').disabled = true;
      document.getElementById('input-card').style.opacity = '0.5';
    }
    updateStats();
    renderHistory();
    if (!over) renderSuggestion();

    // Short delay so user can see each step
    await new Promise(r => setTimeout(r, 600));
  }

  btn.textContent = '▶ 자동 시뮬레이션';
  if (over) btn.disabled = true;
}

// ── Render helpers ──
function elBadge(e) {
  const s = document.createElement('span');
  s.className = 'el el-'+e;
  s.textContent = EL[e];
  return s;
}

function buildPicker() {
  const grid = document.getElementById('picker-grid');
  grid.innerHTML = '';

  // Top-left corner
  const corner = document.createElement('div');
  corner.className = 'pg-corner';
  grid.appendChild(corner);

  // Column headers (positions)
  for (let pos=0;pos<4;pos++) {
    const h = document.createElement('div');
    h.className = 'pg-header';
    h.textContent = (pos+1)+'번';
    grid.appendChild(h);
  }

  // Rows (elements)
  for (let e=0;e<4;e++) {
    // Row label
    const lbl = document.createElement('div');
    lbl.className = 'pg-label';
    lbl.appendChild(elBadge(e));
    lbl.style.width = '22px';
    lbl.style.height = '38px';
    lbl.style.padding = '0';
    lbl.firstChild.style.width = '22px';
    lbl.firstChild.style.height = '22px';
    lbl.firstChild.style.fontSize = '0.72rem';
    lbl.firstChild.style.borderRadius = '5px';
    grid.appendChild(lbl);

    // Buttons for each position
    for (let pos=0;pos<4;pos++) {
      const btn = document.createElement('button');
      btn.className = 'pg-btn' + (sel[pos]===e ? ' '+EC[e] : '');
      btn.textContent = EL[e];
      btn.dataset.pos = pos;
      btn.dataset.el = e;
      btn.onclick = () => pick(pos, e);
      grid.appendChild(btn);
    }
  }
}

function pick(pos, e) {
  sel[pos] = e;
  // Update buttons in that column
  const btns = document.querySelectorAll(`.pg-btn[data-pos="${pos}"]`);
  btns.forEach(b => {
    const be = parseInt(b.dataset.el);
    b.className = 'pg-btn' + (be===e ? ' '+EC[be] : '');
  });
}

function buildNumRows() {
  ['ol','teul'].forEach(type => {
    const row = document.getElementById(type+'-row');
    row.innerHTML = '';
    for (let n=0;n<=4;n++) {
      const btn = document.createElement('button');
      btn.className = 'num-btn';
      btn.textContent = n;
      btn.dataset.val = n;
      btn.onclick = () => setVal(type, n);
      row.appendChild(btn);
    }
  });
  updateFbDisplay();
}

function updateFbDisplay() {
  // Highlight active buttons
  document.querySelectorAll('#ol-row .num-btn').forEach(b => {
    b.className = 'num-btn' + (parseInt(b.dataset.val)===ol ? ' active-ol' : '');
  });
  document.querySelectorAll('#teul-row .num-btn').forEach(b => {
    b.className = 'num-btn' + (parseInt(b.dataset.val)===teul ? ' active-teul' : '');
  });
  document.getElementById('v-mol').textContent = 4-ol-teul;
}

function setVal(type, n) {
  if (type==='ol') {
    ol = Math.min(n, 4-teul);
  } else {
    teul = Math.min(n, 4-ol);
  }
  updateFbDisplay();
}

// 최적 추측을 계산해서 입력칸에 바로 채워둔다 (화면에 따로 표시하지 않음)
function renderSuggestion() {
  document.getElementById('endgame-card').style.display = 'none';
  if (poss.length === 0) return;

  const g = (used === 0) ? FIRST_GUESS.slice() : bestGuess(poss);
  lastRecommendation = g;
  g.forEach((e, pos) => pick(pos, e));
}

function renderHistory() {
  const card = document.getElementById('history-card');
  // Remove old rows
  card.querySelectorAll('.h-row, .game-msg').forEach(r=>r.remove());

  const empty = document.getElementById('hist-empty');
  empty.style.display = history.length ? 'none' : 'block';

  history.forEach((entry, i) => {
    const row = document.createElement('div');
    row.className = 'h-row';

    const num = document.createElement('span');
    num.className = 'h-num';
    num.textContent = i+1;
    row.appendChild(num);

    const els = document.createElement('div');
    els.className = 'h-els';
    entry.guess.forEach(e => els.appendChild(elBadge(e)));
    row.appendChild(els);

    const fbs = document.createElement('div');
    fbs.className = 'h-fbs';
    if (entry.ol)   { const b=document.createElement('span'); b.className='fb fb-ol';   b.textContent=entry.ol+'올';   fbs.appendChild(b); }
    if (entry.teul) { const b=document.createElement('span'); b.className='fb fb-teul'; b.textContent=entry.teul+'틀'; fbs.appendChild(b); }
    if (entry.mol)  { const b=document.createElement('span'); b.className='fb fb-mol';  b.textContent=entry.mol+'몰';  fbs.appendChild(b); }
    row.appendChild(fbs);

    if (entry.possCount != null) {
      const pc = document.createElement('span');
      pc.className = 'h-poss';
      pc.textContent = entry.possCount+'개 중';
      row.appendChild(pc);
    }

    card.appendChild(row);
  });

  if (over) {
    const msg = document.createElement('div');
    const last = history[history.length-1];
    if (last.ol === 4) {
      msg.className = 'game-msg game-win';
      msg.textContent = `${used}번 만에 정답!`;
    } else {
      msg.className = 'game-msg game-lose';
      msg.textContent = `7번을 모두 사용했습니다.`;
    }
    card.appendChild(msg);
  }
}

// 음·술만 표시 — 훈·두는 어차피 4개씩 준비하니까
function renderNeeds() {
  const row = document.getElementById('needs-row');
  row.innerHTML = '';

  if (poss.length === 0) {
    const s = document.createElement('span');
    s.className = 'no-sol';
    s.textContent = '가능한 경우가 없습니다. 입력 내용을 확인하고 처음부터 다시 시작하세요.';
    row.appendChild(s);
    return;
  }

  for (let e = 0; e < 2; e++) {   // 0=음, 1=술
    let min = 4, max = 0;
    for (const p of poss) {
      let c = 0;
      for (let i = 0; i < 4; i++) if (p[i] === e) c++;
      if (c < min) min = c;
      if (c > max) max = c;
    }

    const cell = document.createElement('div');
    cell.className = 'need-cell' + (max === 0 ? ' need-none' : (min === max ? ' need-fixed' : ''));
    cell.appendChild(elBadge(e));

    const num = document.createElement('div');
    num.className = 'need-max';
    num.innerHTML = max + '<em>개</em>';
    cell.appendChild(num);

    const sub = document.createElement('div');
    sub.className = 'need-sub';
    sub.textContent = max === 0 ? '그만 캐!' : (min === max ? '확정' : '');
    cell.appendChild(sub);

    row.appendChild(cell);
  }
}

function updateStats() {
  document.getElementById('stat-left').textContent = Math.max(0, 7-used);
  document.getElementById('stat-used').textContent = used;
  document.getElementById('stat-poss').textContent = poss.length;
  renderNeeds();
}

function recomputePoss() {
  poss = ALL.slice();
  for (const e of history) {
    if (e.ol < 4) poss = filterPoss(poss, e.guess, e.ol, e.teul);
  }
}

function undoLast() {
  if (history.length === 0) return;
  history.pop();
  used--;
  over = false;
  recomputePoss();

  ol = 0; teul = 0;
  updateFbDisplay();
  updateStats();
  renderHistory();
  renderSuggestion();
  document.getElementById('submit-btn').disabled = false;
  document.getElementById('input-card').style.opacity = '1';
  document.getElementById('undo-btn').disabled = (history.length === 0);
}

function showInvalidWarning() {

  btn.classList.remove('invalid');
  void btn.offsetWidth;            // 연속 클릭 시 흔들림 애니메이션 재시작

function submitGuess() {
  if (over) return;

  // Test mode: auto-calculate feedback
  if (testSecret) {
    const f = feedback(sel, testSecret);
    ol = f.ol; teul = f.teul;
    updateFbDisplay();
  }

  // 남는 후보가 하나도 없는 피드백 = 불가능한 조합 (올3틀1 같은 조합, 이전 기록과의 모순 모두 포함)
  if (filterPoss(poss, sel, ol, teul).length === 0) {
    showInvalidWarning();
    return;
  }

  const isWin = (ol === 4);
  const mol = 4 - ol - teul;

  history.push({ guess: sel.slice(), ol, teul, mol, possCount: poss.length });
  used++;

  if (!isWin) {
    poss = filterPoss(poss, sel, ol, teul);
  }

  if (isWin || used >= 7) over = true;

  ol = 0; teul = 0;
  updateFbDisplay();
  document.getElementById('undo-btn').disabled = false;

  if (over) {
    document.getElementById('submit-btn').disabled = true;
    document.getElementById('input-card').style.opacity = '0.5';
  }

  updateStats();
  renderHistory();
  if (!over) renderSuggestion();
  else {
    // Show remaining possibilities after game over (if loss)
    const row = document.getElementById('suggest-row');
    row.innerHTML = '';
    const last = history[history.length-1];
    if (last.ol !== 4 && poss.length > 0) {
      document.getElementById('endgame-card').style.display = 'block';
      poss.slice(0,6).forEach((p,i) => {
        if (i) { const sep=document.createElement('span'); sep.style.cssText='margin:0 4px;color:var(--border)'; sep.textContent='|'; row.appendChild(sep); }
        const wrap=document.createElement('span'); wrap.style.display='inline-flex'; wrap.style.gap='3px';
        p.forEach(e=>wrap.appendChild(elBadge(e)));
        row.appendChild(wrap);
      });
      if (poss.length > 6) {
        const m=document.createElement('span'); m.className='suggest-info'; m.style.marginLeft='6px';
        m.textContent=`외 ${poss.length-6}가지`; row.appendChild(m);
      }
    }
  }
}

// ── 아모리안 파티퀘스트 (다른 퍼즐: 5인 발판 찾기) ──
// 윗줄 A 2 B 3 / 아랫줄 C 6 D 9 5, 총 9칸 중 정답 5칸을 맞히면 성공.
// 매 시도마다 "선택한 5칸 중 정답 개수"만 알려주는 방식이라 길드대항전과는 다른 로직(부분집합 교집합 크기) 사용.
const AMO_ROWS = [ ['A','2','B','3'], ['C','6','D','9','5'] ];
const AMO_ALL_LABELS = AMO_ROWS.flat(); // index 0..8

function amoPopcount(m) {
  let c = 0;
  while (m) { c += m & 1; m >>= 1; }
  return c;
}

// 원소 5개가 켜진 모든 비트마스크 (0~511 중 9C5 = 126가지)
const AMO_ALL_MASKS = [];
for (let m = 0; m < 512; m++) if (amoPopcount(m) === 5) AMO_ALL_MASKS.push(m);

function amoSetToMask(set) {
  let m = 0;
  for (const i of set) m |= (1 << i);
  return m;
}
function amoMaskToSet(m) {
  const s = new Set();
  for (let i = 0; i < 9; i++) if (m & (1 << i)) s.add(i);
  return s;
}

const AMO_FIRST_GUESS = amoSetToMask(new Set([0, 1, 2, 3, 4])); // A 2 B 3 C

// State
let amoPoss = AMO_ALL_MASKS.slice();
let amoHistory = [];
let amoSel = amoMaskToSet(AMO_FIRST_GUESS);
let amoCorrectSel = 0;
let amoUsed = 0;
let amoOver = false;

function amoFeedback(guessMask, secretMask) {
  return amoPopcount(guessMask & secretMask);
}

function amoFilterPoss(possibilities, guessMask, expCorrect) {
  return possibilities.filter(s => amoFeedback(guessMask, s) === expCorrect);
}

// Minimax: 남은 후보 중 최악의 경우를 가장 적게 남기는 추측 선택
// prevMask가 있으면, 정답을 좁히는 효율(worst)이 동률일 때 직전 발판과 가장 적게
// 달라지는(=사람이 덜 움직이는) 추측을 우선한다.
function amoBestGuess(possibilities, prevMask) {
  if (possibilities.length === 0) return null;
  if (possibilities.length === 1) return possibilities[0];

  const possSet = new Set(possibilities);
  let best = possibilities[0];
  let bestScore = Infinity;

  for (const g of AMO_ALL_MASKS) {
    const parts = {};
    for (const s of possibilities) {
      const k = amoFeedback(g, s);
      parts[k] = (parts[k] || 0) + 1;
    }
    const worst = Math.max(...Object.values(parts));
    const moveCost = (prevMask != null) ? amoPopcount(g ^ prevMask) : 0;
    const score = worst * 1000 + moveCost * 2 - (possSet.has(g) ? 1 : 0);
    if (score < bestScore) { bestScore = score; best = g; }
  }
  return best;
}

function buildAmoBoard() {
  const board = document.getElementById('amo-board');
  board.innerHTML = '';
  let idx = 0;
  AMO_ROWS.forEach(labels => {

    rowEl.className = 'amo-tile-row';
    labels.forEach(label => {
      const i = idx++;
      const btn = document.createElement('button');
      btn.className = 'amo-tile' + (amoSel.has(i) ? ' sel' : '');
      btn.textContent = label;
      btn.onclick = () => toggleAmoTile(i);

}

function toggleAmoTile(i) {
  if (amoOver) return;
  if (amoSel.has(i)) {
    amoSel.delete(i);
  } else {
    if (amoSel.size >= 5) return;
    amoSel.add(i);
  }

  updateAmoSelCount();
}

  document.getElementById('amo-sel-count').textContent = amoSel.size;

  const row = document.getElementById('amo-correct-row');

// 최적 추측을 계산해서 발판 선택에 바로 반영 (수정도 가능)
function renderAmoSuggestion() {
  if (amoPoss.length === 0) return;
  let g;
  if (amoUsed === 0) {
    g = AMO_FIRST_GUESS;
  } else {
    const prevMask = amoHistory[amoHistory.length - 1].guessMask;
    g = amoBestGuess(amoPoss, prevMask);
  }
  amoSel = amoMaskToSet(g);
  buildAmoBoard();
  updateAmoSelCount();
}

// 시도 하나를 9칸 미니 보드로 렌더링 (선택된 5칸만 강조)
